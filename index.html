<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邁殘虞</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
        }
        .link-btn {
            background-color: #1a1008;
            border: 1px solid rgba(249, 115, 22, 0.15);
            transition: all 0.2s ease-in-out;
            border-radius: 9999px;
        }
        .link-btn:hover {
            background-color: #26170d;
            border-color: rgba(249, 115, 22, 0.5);
            transform: translateY(-2px);
        }
        .modal-bg {
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(6px);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen justify-between selection:bg-orange-500 selection:text-black">

    <!-- 頂部導航：將星號改為「設定」按鈕 -->
    <header class="w-full max-w-md mx-auto p-4 flex justify-between items-center">
        <button id="openAdminBtn" class="px-3.5 py-2 rounded-full bg-neutral-900 border border-neutral-800 flex items-center gap-2 hover:bg-neutral-800 transition text-neutral-300 shadow-md text-xs font-medium" title="設定頁面">
            <i class="fa-solid fa-gear text-orange-400">
        </button>
        <button id="shareBtn" class="w-10 h-10 rounded-full bg-neutral-900 border border-neutral-800 flex items-center justify-center hover:bg-neutral-800 transition text-neutral-300 shadow-md" title="分享頁面">
            <i class="fa-solid fa-arrow-up-right-from-square text-sm"></i>
        </button>
    </header>

    <main class="w-full max-w-md mx-auto px-6 py-4 flex-grow flex flex-col items-center">
        <!-- 大頭貼容器 -->
        <div class="relative mb-4">
            <div id="avatarContainer" class="w-28 h-28 rounded-full overflow-hidden bg-neutral-800 flex items-center justify-center cursor-pointer border-2 border-transparent hover:border-orange-500/60 transition shadow-lg group relative" title="點擊輸入密碼解鎖權限">
                <img id="profileAvatar" src="https://placehold.co/200x200/1a1a1a/f97316?text=JT" alt="大頭貼" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/200x200/1a1a1a/f97316?text=JT'">
                <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition flex items-center justify-center">
                    <i class="fa-solid fa-lock text-orange-400 text-lg"></i>
                </div>
            </div>
        </div>

        <!-- 標題名稱 -->
        <h1 id="profileTitle" class="text-xl font-bold tracking-wider text-orange-500 mb-8 text-center">
            載入中...
        </h1>

        <!-- 連結按鈕列表 -->
        <div id="linksContainer" class="w-full flex flex-col gap-3.5">
            <!-- 動態插入連結 -->
        </div>
    </main>

    <!-- 底部：已完全刪除版權宣告，保持乾淨 -->
    <footer class="w-full max-w-md mx-auto py-4 px-4"></footer>

    <!-- 密碼輸入驗證 Modal -->
    <div id="passwordModal" class="fixed inset-0 modal-bg z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-neutral-900 border border-neutral-800 rounded-2xl w-full max-w-xs p-6 shadow-2xl text-center space-y-4">
            <div class="w-12 h-12 rounded-full bg-orange-500/10 text-orange-400 flex items-center justify-center mx-auto text-xl">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h3 class="text-lg font-bold text-white">請輸入管理員密碼</h3>
            <form id="passwordForm" class="space-y-3">
                <input type="password" id="inputPassword" placeholder="輸入密碼" required class="w-full bg-neutral-950 border border-neutral-700 rounded-lg px-4 py-2 text-center text-white tracking-widest focus:outline-none focus:border-orange-500">
                <div class="flex gap-2 pt-1">
                    <button type="submit" class="flex-1 bg-orange-500 hover:bg-orange-600 text-black font-semibold py-2 rounded-lg transition text-sm">確認</button>
                    <button type="button" id="closePasswordBtn" class="px-3 bg-neutral-800 hover:bg-neutral-700 text-neutral-300 rounded-lg transition text-sm">取消</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 後臺管理 Modal -->
    <div id="adminModal" class="fixed inset-0 modal-bg z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-neutral-900 border border-neutral-800 rounded-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-6 pb-4 border-b border-neutral-800">
                <h2 class="text-xl font-bold text-orange-500 flex items-center gap-2">
                    <i class="fa-solid fa-sliders"></i> 自定義設定
                </h2>
                <button id="closeAdminBtn" class="text-neutral-400 hover:text-white p-2">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <form id="adminForm" class="space-y-6">
                <!-- 個人檔案設定 -->
                <div class="space-y-4 bg-neutral-950 p-4 rounded-xl border border-neutral-800/60">
                    <h3 class="text-sm font-semibold text-neutral-400 uppercase tracking-wider">個人檔案</h3>
                    <div>
                        <label class="block text-sm font-medium text-neutral-300 mb-1">標題名稱</label>
                        <input type="text" id="inputTitle" required class="w-full bg-neutral-900 border border-neutral-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-orange-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-neutral-300 mb-1">大頭貼網址 (URL)</label>
                        <input type="url" id="inputAvatar" placeholder="https://example.com/image.jpg" class="w-full bg-neutral-900 border border-neutral-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-orange-500">
                        <p class="text-xs text-neutral-500 mt-1">或上傳本機圖片：</p>
                        <input type="file" id="inputAvatarFile" accept="image/*" class="mt-1 text-sm text-neutral-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-orange-500/10 file:text-orange-400 hover:file:bg-orange-500/25 cursor-pointer">
                    </div>
                </div>

                <!-- 連結管理 -->
                <div class="space-y-4 bg-neutral-950 p-4 rounded-xl border border-neutral-800/60">
                    <div class="flex justify-between items-center">
                        <h3 class="text-sm font-semibold text-neutral-400 uppercase tracking-wider">連結按鈕</h3>
                        <button type="button" id="addLinkFieldBtn" class="px-3 py-1 bg-orange-500/20 text-orange-400 hover:bg-orange-500/30 text-xs font-semibold rounded-lg transition flex items-center gap-1">
                            <i class="fa-solid fa-plus"></i> 新增
                        </button>
                    </div>
                    <div id="linksEditorList" class="space-y-3 max-h-64 overflow-y-auto pr-1">
                        <!-- 動態項目 -->
                    </div>
                </div>

                <!-- 儲存 / 重設按鈕 -->
                <div class="flex gap-3 pt-2">
                    <button type="submit" class="flex-1 bg-orange-500 hover:bg-orange-600 text-black font-semibold py-3 rounded-xl transition">
                        儲存變更
                    </button>
                    <button type="button" id="resetDefaultBtn" class="px-4 bg-neutral-800 hover:bg-neutral-700 text-neutral-300 text-sm font-medium rounded-xl transition">
                        重設
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-neutral-800 text-white px-4 py-2 rounded-xl shadow-lg border border-neutral-700 text-sm opacity-0 pointer-events-none transition-opacity duration-300 z-50">
        已成功儲存！
    </div>

    <script>
        const ADMIN_PASSWORD = "1234"; // 你可以在這裡更改你的專屬密碼

        const defaultData = {
            title: "邁殘虞",
            avatar: "https://placehold.co/200x200/1a1a1a/f97316?text=JT",
            links: [
                { title: "列車速度v4.1.6", url: "#" },
                { title: "速度計算v2.9.1", url: "#" },
                { title: "臺鐵45天內加班車資訊", url: "#" },
                { title: "加速度積分 與 GPS測速器", url: "#" }
            ]
        };

        function loadData() {
            const saved = localStorage.getItem('linktree_custom_data');
            if (saved) {
                try { return JSON.parse(saved); } catch (e) { return defaultData; }
            }
            return defaultData;
        }

        let appData = loadData();

        const profileTitle = document.getElementById('profileTitle');
        const profileAvatar = document.getElementById('profileAvatar');
        const avatarContainer = document.getElementById('avatarContainer');
        const linksContainer = document.getElementById('linksContainer');
        
        const passwordModal = document.getElementById('passwordModal');
        const passwordForm = document.getElementById('passwordForm');
        const inputPassword = document.getElementById('inputPassword');
        const closePasswordBtn = document.getElementById('closePasswordBtn');

        const adminModal = document.getElementById('adminModal');
        const openAdminBtn = document.getElementById('openAdminBtn');
        const closeAdminBtn = document.getElementById('closeAdminBtn');
        const adminForm = document.getElementById('adminForm');
        const inputTitle = document.getElementById('inputTitle');
        const inputAvatar = document.getElementById('inputAvatar');
        const inputAvatarFile = document.getElementById('inputAvatarFile');
        const linksEditorList = document.getElementById('linksEditorList');
        const addLinkFieldBtn = document.getElementById('addLinkFieldBtn');
        const resetDefaultBtn = document.getElementById('resetDefaultBtn');
        const shareBtn = document.getElementById('shareBtn');
        const toast = document.getElementById('toast');

        function renderApp() {
            profileTitle.textContent = appData.title;
            profileAvatar.src = appData.avatar;
            linksContainer.innerHTML = '';

            appData.links.forEach((link) => {
                const a = document.createElement('a');
                a.href = link.url || '#';
                a.className = 'link-btn w-full py-4 px-5 flex items-center justify-between shadow-lg group relative';
                
                if (link.url && link.url.startsWith('http')) {
                    a.target = '_blank';
                    a.rel = 'noopener noreferrer';
                }

                a.innerHTML = `
                    <div class="w-6"></div>
                    <span class="font-semibold text-neutral-100 group-hover:text-orange-400 transition text-center flex-grow text-sm sm:text-base">${escapeHtml(link.title)}</span>
                    <button class="text-neutral-500 hover:text-orange-400 p-1 text-sm transition w-6 flex justify-end" onclick="event.preventDefault(); showLinkOptions('${escapeHtml(link.url)}')">
                        <i class="fa-solid fa-ellipsis-vertical"></i>
                    </button>
                `;
                linksContainer.appendChild(a);
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;').replace('"', '&quot;').replace("'", '&#039;');
        }

        window.showLinkOptions = function(url) {
            if (url && url !== '#') {
                copyToClipboard(url);
            } else {
                showToast('此連結未設定網址');
            }
        };

        // 點擊頭像觸發密碼輸入
        avatarContainer.addEventListener('click', () => {
            inputPassword.value = '';
            passwordModal.classList.remove('hidden');
            inputPassword.focus();
        });

        closePasswordBtn.addEventListener('click', () => {
            passwordModal.classList.add('hidden');
        });

        // 密碼驗證邏輯
        passwordForm.addEventListener('submit', (e) => {
            e.preventDefault();
            if (inputPassword.value === ADMIN_PASSWORD) {
                passwordModal.classList.add('hidden');
                openAdmin();
                showToast('解鎖成功！');
            } else {
                showToast('密碼錯誤！');
                inputPassword.value = '';
            }
        });

        function openAdmin() {
            inputTitle.value = appData.title;
            inputAvatar.value = appData.avatar.startsWith('data:') ? '' : appData.avatar;
            renderLinksEditor();
            adminModal.classList.remove('hidden');
        }

        function closeAdmin() {
            adminModal.classList.add('hidden');
        }

        function renderLinksEditor() {
            linksEditorList.innerHTML = '';
            appData.links.forEach((link, index) => {
                const div = document.createElement('div');
                div.className = 'flex items-center gap-2 bg-neutral-900 p-3 rounded-xl border border-neutral-800';
                div.innerHTML = `
                    <div class="flex-grow space-y-2">
                        <input type="text" placeholder="按鈕顯示名稱" value="${escapeHtml(link.title)}" data-index="${index}" class="link-input-title w-full bg-neutral-950 border border-neutral-700 rounded px-3 py-1.5 text-sm text-white focus:outline-none focus:border-orange-500">
                        <input type="text" placeholder="連結網址 (https://...)" value="${escapeHtml(link.url)}" data-index="${index}" class="link-input-url w-full bg-neutral-950 border border-neutral-700 rounded px-3 py-1.5 text-xs text-neutral-300 focus:outline-none focus:border-orange-500">
                    </div>
                    <button type="button" onclick="removeLinkField(${index})" class="text-neutral-500 hover:text-red-400 p-2 transition">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                `;
                linksEditorList.appendChild(div);
            });
        }

        addLinkFieldBtn.addEventListener('click', () => {
            appData.links.push({ title: "新按鈕", url: "https://" });
            renderLinksEditor();
        });

        window.removeLinkField = function(index) {
            appData.links.splice(index, 1);
            renderLinksEditor();
        };

        inputAvatarFile.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    inputAvatar.value = uploadEvent.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        adminForm.addEventListener('submit', (e) => {
            e.preventDefault();
            appData.title = inputTitle.value;
            if (inputAvatar.value.trim() !== '') {
                appData.avatar = inputAvatar.value;
            }

            const titleInputs = linksEditorList.querySelectorAll('.link-input-title');
            const urlInputs = linksEditorList.querySelectorAll('.link-input-url');
            
            const newLinks = [];
            for (let i = 0; i < titleInputs.length; i++) {
                newLinks.push({
                    title: titleInputs[i].value,
                    url: urlInputs[i].value || '#'
                });
            }
            appData.links = newLinks;

            localStorage.setItem('linktree_custom_data', JSON.stringify(appData));
            renderApp();
            closeAdmin();
            showToast('已成功儲存！');
        });

        resetDefaultBtn.addEventListener('click', () => {
            if (confirm('確定要重設為預設資料嗎？')) {
                appData = JSON.parse(JSON.stringify(defaultData));
                localStorage.removeItem('linktree_custom_data');
                renderApp();
                closeAdmin();
                showToast('已重設為預設樣式');
            }
        });

        shareBtn.addEventListener('click', () => {
            copyToClipboard(window.location.href);
        });

        function copyToClipboard(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('網址已複製到剪貼簿！');
            } catch (err) {
                showToast('複製失敗');
            }
            document.body.removeChild(textarea);
        }

        function showToast(message) {
            toast.textContent = message;
            toast.classList.remove('opacity-0');
            setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 2000);
        }

        // 點擊左上角「設定」按鈕同樣需要輸入密碼驗證
        openAdminBtn.addEventListener('click', () => {
            inputPassword.value = '';
            passwordModal.classList.remove('hidden');
            inputPassword.focus();
        });
        
        closeAdminBtn.addEventListener('click', closeAdmin);
        adminModal.addEventListener('click', (e) => {
            if (e.target === adminModal) closeAdmin();
        });
        passwordModal.addEventListener('click', (e) => {
            if (e.target === passwordModal) passwordModal.classList.add('hidden');
        });

        window.onload = () => {
            renderApp();
        };
    </script>
</body>
</html>
