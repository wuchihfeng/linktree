<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邁殠虞</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
        }
        .link-btn {
            background-color: #1a1008;
            border: 1px solid rgba(249, 115, 22, 0.15);
            transition: all 0.2s ease-in-out;
            border-radius: 9999px;
        }
        .link-btn:hover {
            background-color: #26170d;
            border-color: rgba(249, 115, 22, 0.5);
            transform: translateY(-2px);
        }
        .modal-bg {
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(6px);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen justify-between selection:bg-orange-500 selection:text-black">

    <!-- 頂部導航：只保留分享按鈕 -->
    <header class="w-full max-w-md mx-auto p-4 flex justify-end items-center">
        <button id="shareBtn" class="w-10 h-10 rounded-full bg-neutral-900 border border-neutral-800 flex items-center justify-center hover:bg-neutral-800 transition text-neutral-300 shadow-md" title="分享頁面">
            <i class="fa-solid fa-arrow-up-right-from-square text-sm"></i>
        </button>
    </header>

    <main class="w-full max-w-md mx-auto px-6 py-4 flex-grow flex flex-col items-center">
        <!-- 大頭貼容器 -->
        <div class="relative mb-4">
            <div class="w-28 h-28 rounded-full overflow-hidden bg-neutral-800 flex items-center justify-center shadow-lg">
                <img id="profileAvatar" src="avatar.jpg" alt="大頭貼" class="w-full h-full object-cover">
            </div>
        </div>

        <!-- 標題名稱 -->
        <h1 id="profileTitle" class="text-xl font-bold tracking-wider text-orange-500 mb-8 text-center">
            載入中...
        </h1>

        <!-- 連結按鈕列表 -->
        <div id="linksContainer" class="w-full flex flex-col gap-3.5">
            <!-- 動態插入連結 -->
        </div>
    </main>

    <!-- 底部：保持乾淨 -->
    <footer class="w-full max-w-md mx-auto py-4 px-4"></footer>

    <!-- 複製成功提示 Toast -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-neutral-800 text-white px-4 py-2 rounded-xl shadow-lg border border-neutral-700 text-sm opacity-0 pointer-events-none transition-opacity duration-300 z-50">
        網址已複製到剪貼簿！
    </div>

    <script>
        // ==========================================
        // 🌟 個人資料與連結清單 🌟
        // ==========================================
        const pageData = {
            title: "邁殠虞",
            avatar: "avatar.jpg", // 已指定使用本機上傳的頭像檔案
            links: [
                { title: "列車速度v4.1.6", url: "https://wuchihfeng.github.io/trainspeedlatest/" },
                { title: "速度計算v2.9.1", url: "https://wuchihfeng.github.io/trainspeed2.9/" },
                { title: "臺鐵45天內加班車資訊", url: "https://wuchihfeng.github.io/tdx-extra-train-automatic-filtering/" },
                { title: "加速度積分 與 GPS測速器", url: "https://wuchihfeng.github.io/Acceleration-sensor/" },
                { title: "加速度積分 與 GPS測速器 (Longhorn)", url: "https://wuchihfeng.github.io/Acceleration-sensor-longhorn/" }
            ]
        };

        const profileTitle = document.getElementById('profileTitle');
        const profileAvatar = document.getElementById('profileAvatar');
        const linksContainer = document.getElementById('linksContainer');
        const shareBtn = document.getElementById('shareBtn');
        const toast = document.getElementById('toast');

        function renderApp() {
            profileTitle.textContent = pageData.title;
            profileAvatar.src = pageData.avatar;
            linksContainer.innerHTML = '';

            pageData.links.forEach((link) => {
                const a = document.createElement('a');
                a.href = link.url || '#';
                a.className = 'link-btn w-full py-4 px-5 flex items-center justify-between shadow-lg group relative';
                
                if (link.url && link.url.startsWith('http')) {
                    a.target = '_blank';
                    a.rel = 'noopener noreferrer';
                }

                a.innerHTML = `
                    <div class="w-6"></div>
                    <span class="font-semibold text-neutral-100 group-hover:text-orange-400 transition text-center flex-grow text-sm sm:text-base">${escapeHtml(link.title)}</span>
                    <button class="text-neutral-500 hover:text-orange-400 p-1 text-sm transition w-6 flex justify-end" onclick="event.preventDefault(); showLinkOptions('${escapeHtml(link.url)}')">
                        <i class="fa-solid fa-ellipsis-vertical"></i>
                    </button>
                `;
                linksContainer.appendChild(a);
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;').replace('"', '&quot;').replace("'", '&#039;');
        }

        window.showLinkOptions = function(url) {
            if (url && url !== '#') {
                copyToClipboard(url);
            } else {
                showToast('此連結未設定網址');
            }
        };

        shareBtn.addEventListener('click', () => {
            copyToClipboard(window.location.href);
        });

        function copyToClipboard(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('網址已複製到剪貼簿！');
            } catch (err) {
                showToast('複製失敗');
            }
            document.body.removeChild(textarea);
        }

        function showToast(message) {
            toast.textContent = message;
            toast.classList.remove('opacity-0');
            setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 2000);
        }

        window.onload = () => {
            renderApp();
        };
    </script>
</body>
</html>
